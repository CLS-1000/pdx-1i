<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDX-1i — Political Web</title>
<style>
/* SPEC-1 visual language: monochrome. Black canvas, hierarchy by white opacity,
   emphasis by brightness rather than hue. The single hue is the vacancy signal.
   No external fonts or scripts — this file runs offline, like ui/index.html. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #000;
  --surface: rgba(10,10,10,.94);
  --fg1: #fff;
  --fg2: #ccc;
  --fg3: #999;
  --muted: #666;
  --line: rgba(255,255,255,.20);
  --line-soft: rgba(255,255,255,.12);
  --vacant: #00ff00;
  --mono: 'IBM Plex Mono', 'Courier Prime', 'Courier New', monospace;
}

html, body { height: 100%; background: var(--bg); color: var(--fg1);
  font-family: var(--mono); font-size: 13px; overflow: hidden; }

header { position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 20;
  display: flex; align-items: center; gap: 14px; padding: 0 20px;
  background: rgba(0,0,0,.94); border-bottom: 1px solid var(--line); }
.badge { border: 1px solid var(--fg1); font-size: 10px; font-weight: 700;
  padding: 2px 7px; letter-spacing: .14em; }
h1 { font-size: 15px; font-weight: 700; letter-spacing: .08em; }
.sub { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chip { border: 1px solid var(--line); padding: 2px 10px; font-size: 11px;
  color: var(--muted); letter-spacing: .06em; }
.chip.on { border-color: var(--vacant); color: var(--vacant); }
.chip.err { border-color: rgba(255,0,0,.6); color: #f66; }

svg { display: block; cursor: grab; }
svg:active { cursor: grabbing; }

.tie { fill: none; }
.node { cursor: pointer; }
.node .mark { transition: fill-opacity .12s, stroke-opacity .12s; }
.node:hover .mark { fill-opacity: .28; }
.node text { pointer-events: none; font-family: var(--mono); }

aside { position: fixed; top: 52px; right: 0; bottom: 0; width: 330px; z-index: 15;
  background: var(--surface); border-left: 1px solid var(--line);
  padding: 18px 20px; overflow-y: auto; display: none; }
aside.open { display: block; }
.close { float: right; border: 1px solid var(--line); background: none; color: var(--muted);
  font-family: var(--mono); font-size: 11px; padding: 1px 7px; cursor: pointer; }
.close:hover { border-color: var(--fg1); color: var(--fg1); }
.d-name { font-size: 14px; font-weight: 700; letter-spacing: .06em; margin-bottom: 4px; }
.d-group { font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--muted); margin-bottom: 14px; }
.d-flag { display: inline-block; font-size: 10px; border: 1px solid var(--vacant);
  color: var(--vacant); padding: 1px 7px; letter-spacing: .08em; margin-bottom: 12px; }
h2 { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin: 18px 0 8px; padding-bottom: 6px;
  border-bottom: 1px solid var(--line-soft); }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 11px;
  color: var(--fg2); padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.row .k { color: var(--muted); white-space: nowrap; }
.rec { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.rec-top { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.tag { font-size: 9px; border: 1px solid var(--line); padding: 1px 6px;
  letter-spacing: .08em; color: var(--fg3); }
.rec-text { font-size: 11px; color: var(--fg2); line-height: 1.55; }
.rec-meta { font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
.empty { font-size: 11px; color: var(--muted); line-height: 1.6; }

#legend { position: fixed; left: 16px; bottom: 16px; z-index: 15;
  background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; }
#legend h3 { font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 7px; }
.leg { display: flex; align-items: center; gap: 9px; font-size: 11px;
  color: var(--fg2); padding: 2px 0; letter-spacing: .04em; }
.leg svg { display: block; }
.leg-sep { height: 1px; background: var(--line-soft); margin: 7px 0; }

footer { position: fixed; right: 16px; bottom: 16px; z-index: 15; text-align: right;
  font-size: 10px; color: var(--muted); line-height: 1.8; letter-spacing: .08em; }

#msg { position: fixed; inset: 52px 0 0 0; z-index: 30; display: none;
  align-items: center; justify-content: center; background: rgba(0,0,0,.9); }
#msg.show { display: flex; }
.msg-box { border: 1px solid var(--line); padding: 24px 28px; max-width: 520px; }
.msg-box h4 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  margin-bottom: 10px; }
.msg-box p { font-size: 12px; color: var(--fg2); line-height: 1.7; }
.msg-box code { color: var(--fg1); }
</style>
</head>
<body>

<header>
  <span class="badge">PDX-1i</span>
  <h1>POLITICAL WEB</h1>
  <span class="sub">jurisdictions · seats · monitored entities</span>
  <div class="right">
    <span class="chip" id="counts">—</span>
    <span class="chip" id="status">connecting</span>
  </div>
</header>

<svg id="web"></svg>

<div id="legend">
  <h3>Node</h3>
  <div class="leg"><svg width="16" height="16"><polygon points="8,2 14,8 8,14 2,8" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="1"/></svg>Jurisdiction</div>
  <div class="leg"><svg width="16" height="16"><rect x="3" y="3" width="10" height="10" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="1"/></svg>Official seat</div>
  <div class="leg"><svg width="16" height="16"><circle cx="8" cy="8" r="5.5" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="1"/></svg>Monitored entity</div>
  <div class="leg-sep"></div>
  <h3>Tie</h3>
  <div class="leg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="rgba(255,255,255,.85)" stroke-width="1.6"/></svg>Holds seat</div>
  <div class="leg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/></svg>Operates</div>
  <div class="leg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="rgba(255,255,255,.4)" stroke-width="1"/></svg>Regulates</div>
  <div class="leg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="rgba(255,255,255,.22)" stroke-width="1"/></svg>Affiliation</div>
  <div class="leg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="rgba(255,255,255,.6)" stroke-width="1.2" stroke-dasharray="4 3"/></svg>Declared interest</div>
</div>

<footer>
  drag to move · scroll to zoom · click a node<br>
  node size = records mentioning it
</footer>

<aside id="detail"></aside>

<div id="msg"><div class="msg-box" id="msg-box"></div></div>

<script>
/* ---------------------------------------------------------------------------
   PDX-1i political web.

   Every node and tie comes from GET /graph. Nothing is hardcoded here, and the
   page never invents content: if the API is unreachable it says so and renders
   nothing, rather than falling back to a baked-in dataset that could drift from
   what the engine actually holds.

   Encoding follows the registry's own taxonomy:
     shape  <- node.group   diamond jurisdiction, square seat, circle entity
     line   <- tie.kind     declared interests dashed
     size   <- record_count how many stored records mention the node

   record_count is a count and is presented as one. The page adds no adjective,
   ranking or characterisation on top of it — appearing often in public filings
   is what public bodies do.
--------------------------------------------------------------------------- */

const params = new URLSearchParams(location.search);
const API = (params.get('api') || 'http://localhost:8000').replace(/\/$/, '');
const KEY = params.get('key') || '';

const GROUP = { J: 'Jurisdiction', O: 'Official seat', E: 'Monitored entity' };
const KIND = {
  seat:       { label: 'holds seat',       opacity: .85, width: 1.6, dash: null },
  operates:   { label: 'operates',         opacity: .55, width: 1.4, dash: null },
  regulates:  { label: 'regulates',        opacity: .40, width: 1.0, dash: null },
  tie:        { label: 'affiliation',      opacity: .22, width: 1.0, dash: null },
  disclosure: { label: 'declared interest', opacity: .60, width: 1.2, dash: '4 3' },
};

const svg = document.getElementById('web');
const NS = 'http://www.w3.org/2000/svg';
let W = innerWidth, H = innerHeight;

function el(name, attrs = {}) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) if (v !== null) n.setAttribute(k, v);
  return n;
}

function headers() { return KEY ? { 'X-API-Key': KEY } : {}; }

function showMessage(title, html) {
  document.getElementById('msg-box').innerHTML = `<h4>${title}</h4><p>${html}</p>`;
  document.getElementById('msg').classList.add('show');
}

// ── Force layout ───────────────────────────────────────────────────────────
// Small hand-rolled simulation rather than a CDN dependency: 31 nodes and 40
// ties do not need a library, and the rest of ui/ runs offline.

function simulate(nodes, ties, iterations = 700) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const R = Math.min(W, H) * 0.28;

  nodes.forEach((n, i) => {
    const a = (i / nodes.length) * Math.PI * 2;
    n.x = W / 2 + Math.cos(a) * R * (0.7 + 0.3 * ((i % 5) / 5));
    n.y = H / 2 + Math.sin(a) * R * (0.7 + 0.3 * ((i % 3) / 3));
    n.vx = n.vy = 0;
  });

  const edges = ties
    .map(t => ({ s: byId.get(t.source), t: byId.get(t.target), kind: t.kind }))
    .filter(e => e.s && e.t);

  for (let step = 0; step < iterations; step++) {
    const cool = 1 - step / iterations;

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy || 0.01;
        const d = Math.sqrt(d2);
        // Capped so a near-collision cannot fling a pair across the canvas.
        const rep = Math.min(3.5, 20000 / d2);
        const ux = dx / d, uy = dy / d;
        a.vx -= ux * rep; a.vy -= uy * rep;
        b.vx += ux * rep; b.vy += uy * rep;
      }
    }

    for (const e of edges) {
      const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      const d = Math.hypot(dx, dy) || 0.01;
      // Seats sit close to the body they sit on; declared interests hang further out.
      const rest = e.kind === 'seat' ? 78 : e.kind === 'disclosure' ? 150 : 108;
      const f = (d - rest) * 0.030;
      const ux = dx / d, uy = dy / d;
      e.s.vx += ux * f; e.s.vy += uy * f;
      e.t.vx -= ux * f; e.t.vy -= uy * f;
    }

    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.006;
      n.vy += (H / 2 - n.y) * 0.006;
      n.x += Math.max(-10, Math.min(10, n.vx)) * cool;
      n.y += Math.max(-10, Math.min(10, n.vy)) * cool;
      n.vx *= 0.80; n.vy *= 0.80;
    }
  }
  return nodes;
}

// ── Drawing ────────────────────────────────────────────────────────────────

function radius(n) {
  // Base by group, grown by how many records mention the node.
  const base = n.group === 'J' ? 16 : n.group === 'O' ? 12 : 13;
  return base + Math.min(10, (n.record_count || 0) * 1.6);
}

function shape(n, r) {
  if (n.group === 'J') {
    return el('polygon', { points: `0,${-r} ${r},0 0,${r} ${-r},0`, class: 'mark' });
  }
  if (n.group === 'O') {
    const s = r * 1.7;
    return el('rect', { x: -s / 2, y: -s / 2, width: s, height: s, class: 'mark' });
  }
  return el('circle', { r, class: 'mark' });
}

let graph = null, layer = null, view = { x: 0, y: 0, k: 1 }, selected = null;

function render(data) {
  graph = data;
  const nodes = simulate(data.nodes.map(n => ({ ...n })), data.ties);
  const byId = new Map(nodes.map(n => [n.id, n]));

  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.innerHTML = '';
  layer = el('g');
  svg.appendChild(layer);

  const tieLayer = el('g');
  const nodeLayer = el('g');
  layer.appendChild(tieLayer);
  layer.appendChild(nodeLayer);

  for (const t of data.ties) {
    const s = byId.get(t.source), e = byId.get(t.target);
    if (!s || !e) continue;
    const style = KIND[t.kind] || KIND.tie;
    const line = el('line', {
      x1: s.x, y1: s.y, x2: e.x, y2: e.y, class: 'tie',
      stroke: `rgba(255,255,255,${t.flagged ? Math.min(1, style.opacity + 0.3) : style.opacity})`,
      'stroke-width': t.flagged ? style.width + 0.6 : style.width,
      'stroke-dasharray': style.dash,
    });
    line.dataset.source = t.source;
    line.dataset.target = t.target;
    tieLayer.appendChild(line);
  }

  for (const n of nodes) {
    const g = el('g', { class: 'node', transform: `translate(${n.x},${n.y})` });
    g.dataset.id = n.id;
    const r = radius(n);
    const vacant = !!n.flag;

    const mark = shape(n, r);
    mark.setAttribute('fill', '#fff');
    mark.setAttribute('fill-opacity', '.10');
    mark.setAttribute('stroke', vacant ? 'var(--vacant)' : '#fff');
    mark.setAttribute('stroke-width', vacant ? 1.8 : 1.1);
    g.appendChild(mark);

    // Labels wrap on the separators the registry already uses.
    const words = n.label.split(/\s+[-·]\s+|\s+/);
    const lines = [];
    let cur = '';
    for (const w of words) {
      if ((cur + ' ' + w).trim().length > 14) { lines.push(cur.trim()); cur = w; }
      else cur = (cur + ' ' + w).trim();
    }
    if (cur) lines.push(cur);

    const fs = 9.5, lh = fs * 1.25, top = r + 17;
    lines.forEach((line, i) => {
      const t = el('text', {
        'text-anchor': 'middle', y: top + i * lh,
        fill: vacant ? 'var(--vacant)' : 'rgba(255,255,255,.78)',
        'font-size': fs, 'letter-spacing': '.04em',
      });
      t.textContent = line;
      g.appendChild(t);
    });

    if (n.record_count) {
      const c = el('text', {
        'text-anchor': 'middle', y: 3.5, fill: 'rgba(255,255,255,.9)',
        'font-size': 10, 'font-weight': 700,
      });
      c.textContent = n.record_count;
      g.appendChild(c);
    }

    g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
    nodeLayer.appendChild(g);
  }

  fitToViewport(nodes);
  document.getElementById('counts').textContent =
    `${data.node_count} nodes · ${data.tie_count} ties`;
}

function fitToViewport(nodes) {
  // The simulation lays out in its own space and can settle wider than the window.
  // Frame the whole graph on load so nothing starts off-screen and unreachable.
  if (!nodes.length) { applyView(); return; }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    const r = radius(n) + 34; // leave room for the label under each node
    minX = Math.min(minX, n.x - r); maxX = Math.max(maxX, n.x + r);
    minY = Math.min(minY, n.y - r); maxY = Math.max(maxY, n.y + r);
  }

  // The detail panel is closed on load, so the whole width is available. Opening
  // it overlays the right edge rather than reflowing the graph.
  const pad = 20;
  const availW = W - pad * 2;
  const availH = H - 52 - pad * 2;          // header occupies the top
  const k = Math.max(0.3, Math.min(1.9, Math.min(availW / (maxX - minX), availH / (maxY - minY))));

  view.k = k;
  view.x = pad + (availW - (maxX - minX) * k) / 2 - minX * k;
  view.y = 52 + pad + (availH - (maxY - minY) * k) / 2 - minY * k;
  applyView();
}

function applyView() {
  layer.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}

// ── Focus ──────────────────────────────────────────────────────────────────

function select(id) {
  if (selected === id) { clearSelection(); return; }
  selected = id;

  const near = new Set([id]);
  for (const t of graph.ties) {
    if (t.source === id) near.add(t.target);
    if (t.target === id) near.add(t.source);
  }

  svg.querySelectorAll('.node').forEach(g => {
    g.style.opacity = near.has(g.dataset.id) ? 1 : 0.12;
  });
  svg.querySelectorAll('.tie').forEach(l => {
    const on = l.dataset.source === id || l.dataset.target === id;
    l.style.opacity = on ? 1 : 0.06;
  });

  loadDetail(id);
}

function clearSelection() {
  selected = null;
  svg.querySelectorAll('.node').forEach(g => (g.style.opacity = 1));
  svg.querySelectorAll('.tie').forEach(l => (l.style.opacity = 1));
  document.getElementById('detail').classList.remove('open');
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function loadDetail(id) {
  const aside = document.getElementById('detail');
  aside.classList.add('open');
  aside.innerHTML = '<div class="empty">loading…</div>';

  let d;
  try {
    const res = await fetch(`${API}/graph/${encodeURIComponent(id)}`, { headers: headers() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    d = await res.json();
  } catch (err) {
    aside.innerHTML =
      `<button class="close" onclick="clearSelection()">close</button>` +
      `<div class="empty">Could not load ${esc(id)} — ${esc(err.message)}.</div>`;
    return;
  }

  const n = d.node;
  const tieRows = d.ties.map(t => {
    const other = t.source === id ? t.target : t.source;
    const dir = t.source === id ? '→' : '←';
    const k = (KIND[t.kind] || {}).label || t.kind;
    return `<div class="row"><span class="k">${esc(k)}${t.flagged ? ' ⚑' : ''}</span>` +
           `<span>${dir} ${esc(other)}</span></div>`;
  }).join('');

  const recRows = d.records.length ? d.records.map(r => `
    <div class="rec">
      <div class="rec-top">
        <span class="tag">${esc(r.outcome)}</span>
        <span class="tag">${esc(r.tier)}</span>
        <span class="tag">${esc(r.source)}</span>
      </div>
      <div class="rec-text">${esc(r.pattern)}</div>
      <div class="rec-meta">confidence ${Number(r.confidence).toFixed(2)} ·
        ${esc(String(r.published_at).slice(0, 10))} · ${esc(r.record_id)}</div>
    </div>`).join('')
    : '<div class="empty">No stored record mentions this node.</div>';

  aside.innerHTML = `
    <button class="close" onclick="clearSelection()">close</button>
    <div class="d-name">${esc(n.label)}</div>
    <div class="d-group">${esc(GROUP[n.group] || n.group)}</div>
    ${n.flag ? `<div class="d-flag">${esc(n.flag)}</div>` : ''}
    <div class="row"><span class="k">id</span><span>${esc(n.id)}</span></div>
    <div class="row"><span class="k">records mentioning</span><span>${n.record_count}</span></div>
    <h2>Ties (${d.ties.length})</h2>${tieRows}
    <h2>Records (${d.records.length})</h2>${recRows}`;
}

// ── Pan / zoom ─────────────────────────────────────────────────────────────

let dragging = false, last = null;
svg.addEventListener('mousedown', e => { dragging = true; last = [e.clientX, e.clientY]; });
addEventListener('mouseup', () => { dragging = false; });
addEventListener('mousemove', e => {
  if (!dragging) return;
  view.x += e.clientX - last[0];
  view.y += e.clientY - last[1];
  last = [e.clientX, e.clientY];
  applyView();
});
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const k = Math.max(0.25, Math.min(3, view.k * f));
  view.x = e.clientX - (e.clientX - view.x) * (k / view.k);
  view.y = e.clientY - (e.clientY - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, { passive: false });
svg.addEventListener('click', clearSelection);

addEventListener('resize', () => {
  W = innerWidth; H = innerHeight;
  if (graph) render(graph);
});

// ── Boot ───────────────────────────────────────────────────────────────────

(async function boot() {
  const status = document.getElementById('status');
  try {
    const res = await fetch(`${API}/graph`, { headers: headers() });
    if (res.status === 401) {
      status.textContent = 'unauthorized';
      status.className = 'chip err';
      showMessage('API key required', `This API has <code>PDX1_API_KEY</code> set. ` +
        `Reload with <code>?key=YOUR_KEY</code>.`);
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
    status.textContent = 'live';
    status.className = 'chip on';
  } catch (err) {
    status.textContent = 'offline';
    status.className = 'chip err';
    showMessage('No graph to draw', `Could not reach <code>${esc(API)}/graph</code> — ` +
      `${esc(err.message)}.<br><br>Start the API with <code>pdx1-api</code>, or point this ` +
      `page elsewhere with <code>?api=https://host</code>.<br><br>` +
      `This page renders only what the engine serves; there is no built-in dataset ` +
      `to fall back to.`);
  }
})();
</script>
</body>
</html>
