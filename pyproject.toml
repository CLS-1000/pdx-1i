[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-1i"
version = "0.1.0"
description = "PDX-1i — Portland Metro Intelligence platform. Real-time OSINT for Portland-area politics, infrastructure, and civic intelligence."
requires-python = ">=3.12"
authors = [
    {name = "CLS-1000", email = "contact@cls-1000.org"}
]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "httpx>=0.27",
    "feedparser==6.0.10",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "python-dateutil>=2.8",
    "anthropic>=0.20",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "tzlocal>=4.0",
    "sqlalchemy>=2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -q"
timeout = 30

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/test_*", "*/__pycache__/*"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = [
    "E402",
    "E741",
    "E702",
]
exclude = [".venv", ".git", "build", "dist"]
