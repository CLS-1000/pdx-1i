[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-1i"
version = "0.1.0"
description = "PDX-1i — Portland Metro Intelligence platform. Real-time OSINT for Portland-area politics, infrastructure, and civic intelligence."
requires-python = ">=3.12"
authors = [
    {name = "CLS-1000", email = "contact@cls-1000.org"}
]
license = {text = "MIT"}

# Runtime dependencies of the engine as it stands — everything the pipeline actually
# imports. Capabilities that are not built yet are extras, so a plain install does not
# pull a web framework and a PDF library for a batch job.
dependencies = [
    "pydantic>=2.0",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Live HTTP fetching, for when the adapters move off fixtures.
live = [
    "httpx>=0.27",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "python-dateutil>=2.8",
]
# The FastAPI surface and the daily scheduler.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "tzlocal>=4.0",
]
# PDF newsletter output.
pdf = ["reportlab>=4.0"]
# Optional LLM-written explanations. Not used by scoring, which stays deterministic.
llm = ["anthropic>=0.20"]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff",
    "bandit",
]

[project.scripts]
pdx1 = "pdx1.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--strict-markers -q"
timeout = 30

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/test_*", "*/__pycache__/*"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = [
    "E402",
    "E741",
    "E702",
]
exclude = [".venv", ".git", "build", "dist"]
