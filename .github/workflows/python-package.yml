name: Python package

on:
  push:
    branches: [ "main", "claude/**" ]
  # No base-branch filter: a PR merging into any branch must be tested, not
  # just one targeting main. PR #15 targeted a copilot/** branch and merged
  # without this workflow ever running.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff bandit

    - name: Lint with ruff
      run: ruff check src/ tests/

    - name: Security check with bandit
      run: bandit -r src/ -ll

    - name: Test with pytest
      run: pytest tests/ -v --tb=short

    - name: Coverage report
      run: pytest --cov=src --cov-report=term-missing tests/
